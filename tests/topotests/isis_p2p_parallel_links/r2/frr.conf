hostname r2
!
interface lo
 ip address 10.255.0.2/32
 ip router isis TEST
 isis passive
exit
!
interface r2-eth0
 ip address 10.0.1.2/24
 ip router isis TEST
 isis hello-interval 1
 isis network point-to-point
 isis metric 10
exit
!
interface r2-eth1
 ip address 10.0.2.2/24
 ip router isis TEST
 isis hello-interval 1
 isis network point-to-point
 isis metric 50
exit
!
router isis TEST
 net 49.0001.0000.0000.0002.00
 is-type level-2-only
 lsp-gen-interval 1
exit
!
